server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: clearwatch-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clearwatch}
    username: ${DATABASE_USERNAME:clearwatch}
    password: ${DATABASE_PASSWORD:clearwatch}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    time-zone: UTC

clearwatch:
  admin:
    email: ${ADMIN_EMAIL:admin@clearwatch.dev}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  jwt:
    secret: ${JWT_SECRET:dev-only-clearwatch-secret-change-me-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    speed: ${SIMULATOR_SPEED:1}
    failure-interval-minutes: ${SIMULATOR_FAILURE_INTERVAL_MINUTES:15}
  retention:
    days: ${RETENTION_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.clearwatch: INFO
