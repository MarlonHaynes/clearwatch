services:
  postgres:
    image: postgres:16-alpine
    container_name: clearwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clearwatch
      POSTGRES_USER: clearwatch
      POSTGRES_PASSWORD: clearwatch
    ports:
      - "5432:5432"
    volumes:
      - clearwatch-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearwatch -d clearwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clearwatch-pg-data:
